[workspace]
members = ["crates/omnisem-core", "crates/omnisem-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/v-t-r-gg/omni-sem"
rust-version = "1.88"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
globset = "0.4"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
rmcp = { version = "3.1.0", default-features = false, features = ["macros", "server", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = { version = "1.2", default-features = false, features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false, features = ["io-std", "macros", "rt-multi-thread", "sync"] }
toml = "0.8"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
url = "2.5"
uuid = { version = "1.17", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
